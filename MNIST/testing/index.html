<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digit drawer</title>
<style>
  :root {
    --page: #20242a;
    --panel: #2a2f37;
    --line: #3b424c;
    --text: #e6e8ea;
    --muted: #98a0aa;
    --chalk: #f1e6b8;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; justify-content: center; }
  .pad { display: flex; flex-direction: column; gap: 12px; }
  #drawer {
    width: 280px; height: 280px; max-width: 100%;
    background: #000; border: 1px solid var(--line); border-radius: var(--radius);
    cursor: crosshair; touch-action: none; display: block;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0; }
  button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 6px 16px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, #drawer:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }

  .side { width: 220px; display: flex; flex-direction: column; gap: 20px; }
  .side h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .seen { display: flex; align-items: center; gap: 12px; }
  #preview {
    width: 84px; height: 84px; background: #000; border: 1px solid var(--line);
    border-radius: var(--radius); image-rendering: pixelated;
  }
  .status { color: var(--muted); font-size: 14px; margin: 0; min-height: 1.5em; }
  .status.error { color: #e08a7a; }

  .bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .bars li { display: grid; grid-template-columns: 16px 1fr 44px; align-items: center; gap: 10px; }
  .bars .digit { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bars .track { height: 10px; background: var(--panel); border-radius: 3px; overflow: hidden; }
  .bars .fill { height: 100%; width: 0; background: var(--muted); transition: width 120ms ease-out; }
  .bars .pct { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .bars li.top .digit, .bars li.top .pct { color: var(--chalk); }
  .bars li.top .fill { background: var(--chalk); }
  @media (prefers-reduced-motion: reduce) { .bars .fill { transition: none; } }
</style>
</head>
<body>
<main>
  <section class="pad">
    <canvas id="drawer" width="280" height="280" aria-label="Drawing area" tabindex="0"></canvas>
    <div class="row">
      <p class="hint">Draw a single digit.</p>
      <button id="clear" type="button">Clear</button>
    </div>
  </section>

  <section class="side" aria-live="polite">
    <div>
      <h2>Confidence</h2>
      <ul class="bars" id="bars"></ul>
    </div>
    <div>
      <h2>What the network sees</h2>
      <div class="seen">
        <canvas id="preview" width="28" height="28"></canvas>
        <p class="status" id="status"></p>
      </div>
    </div>
  </section>
</main>

<script>
const SIZE = 280;                 // drawing canvas, 10x the 28x28 MNIST grid
const BRUSH = 20;                 // brush width in canvas px
const THRESH = 0.08;              // ink below this (0..1) is ignored when finding the bounding box
const THROTTLE_MS = 70;           // min time between live predictions while drawing
const SERVER = 'http://localhost:8000/predict';

const canvas = document.getElementById('drawer');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const preview = document.getElementById('preview');
const pctx = preview.getContext('2d');
const statusEl = document.getElementById('status');

// ---------------------------------------------------------------- drawing
function clearCanvas() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SIZE, SIZE);
  pctx.fillStyle = '#000';
  pctx.fillRect(0, 0, 28, 28);
  showProbs(null);
  setStatus('');
}

let drawing = false;
let last = { x: 0, y: 0 };

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (SIZE / r.width), y: (e.clientY - r.top) * (SIZE / r.height) };
}

canvas.addEventListener('pointerdown', (e) => {
  drawing = true;
  canvas.setPointerCapture(e.pointerId);
  last = pos(e);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(last.x, last.y, BRUSH / 2, 0, Math.PI * 2);
  ctx.fill();
  requestPredict();
});

canvas.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  const p = pos(e);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = BRUSH;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(last.x, last.y);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  last = p;
  requestPredict();
});

function endStroke() {
  if (!drawing) return;
  drawing = false;
  requestPredict(true);   // final reading from the finished digit
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
document.getElementById('clear').addEventListener('click', () => { generation++; clearCanvas(); });

// ---------------------------------------------------------------- readout
const bars = document.getElementById('bars');
for (let d = 0; d < 10; d++) {
  const li = document.createElement('li');
  li.innerHTML = `<span class="digit">${d}</span>
                  <span class="track"><span class="fill"></span></span>
                  <span class="pct">0%</span>`;
  bars.appendChild(li);
}

function showProbs(probs) {
  const items = bars.children;
  const top = probs ? probs.indexOf(Math.max(...probs)) : -1;
  for (let d = 0; d < 10; d++) {
    const p = probs ? probs[d] : 0;
    items[d].classList.toggle('top', d === top);
    items[d].querySelector('.fill').style.width = (p * 100).toFixed(1) + '%';
    items[d].querySelector('.pct').textContent = Math.round(p * 100) + '%';
  }
}

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
}

// ---------------------------------------------------------------- preprocessing
// Canvas -> 784 floats in 0..1, laid out like an MNIST image (white digit on black,
// digit scaled to fit 20x20, then centered by center of mass in 28x28).

function readGray() {
  const rgba = ctx.getImageData(0, 0, SIZE, SIZE).data;
  const g = new Float32Array(SIZE * SIZE);
  for (let i = 0; i < g.length; i++) g[i] = rgba[i * 4] / 255;   // R channel is enough, it's grayscale
  return g;
}

function findBoundingBox(g) {
  let minX = SIZE, minY = SIZE, maxX = -1, maxY = -1;
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      if (g[y * SIZE + x] > THRESH) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  return maxX < 0 ? null : { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

// Area-average downscale of the cropped box to outW x outH (keeps soft gray edges).
function resizeBox(g, box, outW, outH) {
  const out = new Float32Array(outW * outH);
  for (let oy = 0; oy < outH; oy++) {
    const y0 = box.y + (oy * box.h) / outH, y1 = box.y + ((oy + 1) * box.h) / outH;
    for (let ox = 0; ox < outW; ox++) {
      const x0 = box.x + (ox * box.w) / outW, x1 = box.x + ((ox + 1) * box.w) / outW;
      let sum = 0, area = 0;
      for (let y = Math.floor(y0); y < Math.ceil(y1); y++) {
        const wy = Math.min(y + 1, y1) - Math.max(y, y0);
        for (let x = Math.floor(x0); x < Math.ceil(x1); x++) {
          const wx = Math.min(x + 1, x1) - Math.max(x, x0);
          sum += g[y * SIZE + x] * wx * wy;
          area += wx * wy;
        }
      }
      out[oy * outW + ox] = area > 0 ? sum / area : 0;
    }
  }
  return out;
}

function centerByMass(img) {          // img: 28*28 floats
  let m = 0, cx = 0, cy = 0;
  for (let y = 0; y < 28; y++) {
    for (let x = 0; x < 28; x++) {
      const v = img[y * 28 + x];
      m += v; cx += v * x; cy += v * y;
    }
  }
  if (m === 0) return img;
  const sx = Math.round(14 - cx / m), sy = Math.round(14 - cy / m);
  const out = new Float32Array(28 * 28);
  for (let y = 0; y < 28; y++) {
    for (let x = 0; x < 28; x++) {
      const nx = x + sx, ny = y + sy;
      if (nx >= 0 && nx < 28 && ny >= 0 && ny < 28) out[ny * 28 + nx] = img[y * 28 + x];
    }
  }
  return out;
}

function preprocess() {
  const g = readGray();
  const box = findBoundingBox(g);
  if (!box) return null;                                   // blank canvas

  const scale = 20 / Math.max(box.w, box.h);
  const w = Math.max(1, Math.round(box.w * scale));
  const h = Math.max(1, Math.round(box.h * scale));
  const small = resizeBox(g, box, w, h);

  const img = new Float32Array(28 * 28);                   // paste into the middle of 28x28
  const ox = Math.floor((28 - w) / 2), oy = Math.floor((28 - h) / 2);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) img[(y + oy) * 28 + (x + ox)] = small[y * w + x];

  return centerByMass(img);
}

function drawPreview(img) {
  const id = pctx.createImageData(28, 28);
  for (let i = 0; i < 784; i++) {
    const v = Math.round(img[i] * 255);
    id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v;
    id.data[i * 4 + 3] = 255;
  }
  pctx.putImageData(id, 0, 0);
}

// ---------------------------------------------------------------- live prediction
// At most one request in flight. If more strokes arrive meanwhile, one more
// request runs afterwards with the newest drawing. `generation` drops answers
// that belong to a drawing that was cleared.
let busy = false, pending = false, lastRun = 0, generation = 0, timer = null;

function requestPredict(force = false) {
  const wait = THROTTLE_MS - (performance.now() - lastRun);
  if (!force && wait > 0) {
    if (!timer) timer = setTimeout(() => { timer = null; requestPredict(); }, wait);
    return;
  }
  if (busy) { pending = true; return; }
  run();
}

async function run() {
  busy = true;
  lastRun = performance.now();
  const gen = generation;
  try {
    const img = preprocess();
    if (!img) { showProbs(null); return; }
    drawPreview(img);
    const res = await fetch(SERVER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pixels: Array.from(img) }),
    });
    if (!res.ok) throw new Error('server returned ' + res.status);
    const { probs } = await res.json();
    if (gen === generation) { showProbs(probs); setStatus(''); }
  } catch (err) {
    setStatus('No answer from ' + SERVER, true);
    console.error(err);
  } finally {
    busy = false;
    if (pending) { pending = false; requestPredict(); }
  }
}

clearCanvas();
</script>
</body>
</html>
